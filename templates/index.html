<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RFID Tag Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #007bff;
            color: white;
            padding: 20px 30px;
            width: 99%;
            margin: 20px auto 0 auto;
            height: 100px;
            border-radius: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }

        .top-bar h1 {
            font-size: 36px;
            font-weight: 600;
            margin: 0;
        }

        .top-bar .logout-btn {
            background: white;
            color: #007bff;
            border: none;
            padding: 12px 26px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .top-bar .logout-btn:hover {
            background-color: #e0e0e0;
        }

        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 80vh;
            padding-top: 40px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 95%;
            max-width: 450px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
            border-radius: 10px;
            text-align: center;
        }

        h2 {
            color: #343a40;
            margin-bottom: 25px;
            font-size: 32px; /* Larger title */
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ced4da;
            border-radius: 6px;
        }

        .btn-custom {
            margin-top: 20px;
            padding: 16px 32px;  /* Bigger button */
            font-size: 18px;     /* Larger font */
            font-weight: bold;
            border: none;
            border-radius: 8px;
            color: #fff;
            background-color: #007bff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .btn-custom:hover {
            background-color: #0056b3;
        }

        .epc-display {
            margin-top: 25px;
            font-size: 16px;
            color: #444;
        }

        .popup {
            visibility: hidden;
            position: fixed;
            background: rgba(0, 0, 0, 0.5);
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .popup-content {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        .popup-content p {
            font-size: 18px;
        }

        .popup-content button {
            margin-top: 20px;
            padding: 8px 20px;
            font-size: 14px;
            border: none;
            background-color: #28a745;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
    <h1>RFID Registration Portal</h1>
    <div style="display: flex; gap: 15px;">
        <form action="/registered" method="GET" style="margin: 0;">
            <button type="submit" class="logout-btn">Registered Tags</button>
        </form>
        <form action="/logout" method="POST" style="margin: 0;">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>
</div>


<!-- Main Body -->
<div class="main-wrapper">
    <div class="container">
        <h2>RFID Tag Registration</h2>

        {% if step == 'name' %}
        <form method="POST" action="/register">
            <div class="mb-3 text-start">
                <label for="epc">EPC</label>
                <input type="text" id="epc" name="epc_display" value="{{ epc }}" readonly class="form-control bg-light">
            </div>
            <div class="mb-3 text-start">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter name" required class="form-control">
            </div>
            <button type="submit" class="btn btn-custom">Save</button>
        </form>
        {% else %}
        <form method="POST" action="/admin/scan">
            <button type="submit" class="btn btn-custom">
                {% if step == 'rescan' %}
                    Rescan to Confirm
                {% else %}
                    Scan Tag
                {% endif %}
            </button>
        </form>
        {% endif %}

        {% if status %}
            <div class="alert alert-info mt-3" role="alert">
                {{ status }}
            </div>
        {% endif %}


        {% if epc and step == 'done' %}
        <div class="epc-display text-center">
            <p><strong>Registered EPC:</strong> {{ epc }}</p>
            {% if name %}
            <p><strong>Name:</strong> {{ name }}</p>
            {% endif %}
        </div>
        {% endif %}
    </div>
</div>

<!-- Popup for Status Messages -->
<div class="popup" id="popup">
    <div class="popup-content">
        <p id="popup-message"></p>
        <button onclick="closePopup()">OK</button>
    </div>
</div>

<script>
    const statusMessage = "{{ status | safe }}";
    const popup = document.getElementById("popup");
    const popupMessage = document.getElementById("popup-message");

    if (statusMessage) {
        popupMessage.textContent = statusMessage;
        popup.style.visibility = "visible";
    }

   function closePopup() {
    popup.style.visibility = "hidden";
    }

    setTimeout(() => {
        if (popup.style.visibility === "visible") {
            closePopup();
        }
    }, 4000);

</script>

</body>
</html>
