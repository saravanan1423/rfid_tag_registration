<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <!-- jQuery & DataTables JS -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <style>
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #007bff;
            color: white;
            padding: 20px 30px;
            width: 99%;
            margin: 20px auto 0 auto;
            height: 100px;
            border-radius: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }

        .top-bar h1 {
            font-size: 36px;
            font-weight: 600;
            margin: 0;
        }

        .top-bar .logout-btn {
            background: white;
            color: #007bff;
            border: none;
            padding: 12px 26px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .top-bar .logout-btn:hover {
            background-color: #e0e0e0;
        }

        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 80vh;
            padding-top: 40px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 95%;
            max-width: 950px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        .table-container {
            max-width: 100%;
            margin: auto;
        }

        table {
            font-size: 1rem;
        }

        td, th {
            padding: 0.65rem !important;
            vertical-align: middle !important;
        }

        /* Light gray row separation */
        #epcTable tbody tr {
            border-bottom: 1px solid #dee2e6;
        }

        /* Search bar styling */
        .dataTables_filter {
            float: left !important;
            margin-bottom: 10px;
            margin-left: 5px;
            margin-top: 20px;
        }

        .dataTables_filter input {
            border-radius: 6px;
            border: 1px solid #ccc;
            padding: 6px 10px;
            font-size: 0.95rem;
        }

        /* Heading styling */
        .heading-container {
            max-width: 600px;
            margin: 60px auto 25px auto;
            text-align: center;
        }

        .table-heading {
            font-size: 28px;
            font-weight: 600;
            color: #343a40;
            margin: 0;
        }
    </style>
</head>
<body class="bg-light">
    <div class="top-bar">
        <!-- Back Button -->
        <div style="display: flex; align-items: center; gap: 20px;">
            <form action="/admin" method="GET" style="margin: 0;">
                <button type="submit" class="logout-btn" style="padding: 10px 20px;">←</button>
            </form>
            <h1 style="margin: 0;">RFID Registration Portal</h1>
        </div>
        
        <!-- Logout Button -->
        <form action="/logout" method="POST" style="margin: 0;">
            <button class="logout-btn">Logout</button>
        </form>
    </div>

    <!-- Main Body -->
    <div class="main-wrapper">
        <div class="container table-container">

            <!-- ✅ Heading: placed after the search bar visually -->
            <div class="heading-container">
                <h2 class="table-heading">Registered EPC Tags</h2>
            </div>

            <!-- ✅ Table -->
            <table id="epcTable" class="table table-bordered table-hover bg-white shadow-sm">
                <thead class="table-dark text-center">
                    <tr>
                        <th scope="col">S.No.</th>
                        <th scope="col">EPC</th>
                        <th scope="col">Name</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody class="text-center">
                    {% for user in users %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ user.epc }}</td>
                        <td>{{ user.name }}</td>
                        <td>
                            <form action="{{ url_for('delete_user', user_id=user.id) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this record?');">
                                <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

        </div>
    </div>

    <script>
        $(document).ready(function () {
            $('#epcTable').DataTable({
                "pageLength": 8,
                "lengthChange": false,
                "searching": true,
                "ordering": true,
                "info": false,
                "stripeClasses": ['table-light', '']
            });
        });
    </script>
</body>
</html>
